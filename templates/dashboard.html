<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Agro - Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-image: url('{{ url_for('static', filename='home.jpeg') }}');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white;
        }

        .navbar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: #33333300;
            padding: 1rem;
        }

        .navbar a {
            color: rgb(255, 255, 255);
            text-decoration: none;
            padding: 0.5rem 1rem;
            transition: background-color 0.3s ease;
            text-decoration: solid;
        }

        .navbar a:hover {
            background-color: rgba(0, 128, 0, 0.945);
            border-radius: 4px;
        }

        .hero {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
            background-color: #f4f4f400;
            text-align: center;
        }

        .hero h1 {
            font-size: 3rem;
            margin: 0;
            padding-right: 950px;
            font-size: 80px;
        }

        .hero p {
            font-size: 2rem;
            margin-top: 1rem;
            border-radius: 10px;
            color: greenyellow;
        }

        .dashboard {
            padding: 2rem;
            background-color: rgba(0, 0, 0, 0.7);
            margin: 2rem;
            border-radius: 10px;
        }

        .dashboard h1 {
            color: green;
        }

        .dashboard textarea {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .dashboard button {
            padding: 0.5rem 1rem;
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .dashboard button:hover {
            background-color: darkgreen;
        }

        .dashboard h2 {
            color: green;
        }

        .dashboard p {
            color: white;
        }

        .dashboard a {
            color: green;
            text-decoration: none;
        }

        .dashboard a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="#home"><B>Home</B></a>
        <a href="{{ url_for('aboutus') }}">About Us</a> <!-- Corrected this line -->
        <a href="{{ url_for('rental') }}">Rental</a>
        <a href="#contact"><B>Contact Us</B></a>
    </div>

    <div class="hero" id="home">
        <div>
            <h1 style="color: green;">NEXT AGRO</h1>
            <p style="padding-right: 900px;">Revolutionary Agritech</p>
        </div>
    </div>

    <div class="dashboard">
        <h1>Welcome, {{ username }}!</h1>
        <form method="POST" action="/dashboard">
            <textarea name="message" placeholder="Write your discussion..." required></textarea><br>
            <button type="submit">Post Discussion</button>
        </form>
        <h2>Community Discussions</h2>
        {% for post in posts %}
            <p><strong>{{ post[0] }}</strong> from <em>{{ post[1] }}</em>: {{ post[2] }}</p>
        {% endfor %}
        <a href="/logout">Logout</a>
